<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Us - Anime Style</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa&family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Comfortaa', cursive;
      background: linear-gradient(to bottom right, #ffe0f0, #d0e8ff);
      overflow-x: hidden;
    }

    /* Floating sakura petals */
    .sakura {
      position: absolute;
      top: -50px;
      width: 20px;
      height: 20px;
      background: url('https://i.ibb.co/Sr4WDh3/sakura.png') no-repeat center/contain;
      animation: fall 10s linear infinite;
      opacity: 0.8;
      pointer-events: none;
    }

    @keyframes fall {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translateY(100vh) rotate(360deg);
        opacity: 0;
      }
    }

    /* Slide-in animation */
    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(50px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Bounce animation for avatar */
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .contact-container {
      max-width: 600px;
      margin: 5rem auto;
      background: rgba(255, 255, 255, 0.95);
      padding: 2rem;
      border-radius: 20px;
      box-shadow: 0 0 20px rgba(255, 182, 193, 0.5);
      position: relative;
      z-index: 1;
      animation: slideIn 1s ease-out;
    }

    .contact-container h2 {
      text-align: center;
      font-family: 'Press Start 2P', cursive;
      font-size: 1.5rem;
      color: #ff66a3;
      margin-bottom: 2rem;
    }

    .avatar {
      width: 80px;
      display: block;
      margin: 0 auto 1rem;
      animation: bounce 2s infinite;
    }

    .form-group {
      margin-bottom: 1.5rem;
      position: relative;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 1rem;
      border: 2px solid #ffb6c1;
      border-radius: 10px;
      background: #fff0f6;
      font-size: 1rem;
      transition: 0.3s;
    }

    .form-group input:focus,
    .form-group textarea:focus {
      border-color: #ff69b4;
      outline: none;
      box-shadow: 0 0 8px #ff69b4;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.3rem;
      font-weight: bold;
      color: #444;
    }

    textarea {
      resize: vertical;
      min-height: 100px;
    }

    button {
      width: 100%;
      padding: 0.9rem;
      border: none;
      border-radius: 12px;
      background: linear-gradient(to right, #ff8fa3, #ff66a3);
      color: white;
      font-size: 1.1rem;
      cursor: pointer;
      font-family: 'Press Start 2P', cursive;
      letter-spacing: 1px;
      transition: 0.3s ease;
    }

    button:hover {
      background: linear-gradient(to right, #ff66a3, #ff1493);
      box-shadow: 0 0 10px #ff69b4;
    }

    @media (max-width: 600px) {
      .contact-container {
        margin: 2rem;
        padding: 1.5rem;
      }

      .contact-container h2 {
        font-size: 1.2rem;
      }

      button {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>

  <!-- Floating Sakura Petals -->
  <div class="sakura" style="left: 5%; animation-delay: 0s;"></div>
  <div class="sakura" style="left: 25%; animation-delay: 2s;"></div>
  <div class="sakura" style="left: 50%; animation-delay: 4s;"></div>
  <div class="sakura" style="left: 75%; animation-delay: 1s;"></div>
  <div class="sakura" style="left: 90%; animation-delay: 3s;"></div>

  <!-- Contact Form -->
  <div class="contact-container">
    <img src="https://i.ibb.co/1zBXYkx/chibi-avatar.png" alt="Chibi Character" class="avatar" />
    <h2>Contact Us</h2>
    <form>
      <div class="form-group">
        <label for="name">🌸 Your Name</label>
        <input type="text" id="name" name="name" required />
      </div>
      <div class="form-group">
        <label for="email">📧 Your Email</label>
        <input type="email" id="email" name="email" required />
      </div>
      <div class="form-group">
        <label for="subject">📝 Subject</label>
        <input type="text" id="subject" name="subject" required />
      </div>
      <div class="form-group">
        <label for="message">💌 Message</label>
        <textarea id="message" name="message" required></textarea>
      </div>
      <button type="submit">Send 🌸</button>
    </form>
  </div>
</body>
</html>
